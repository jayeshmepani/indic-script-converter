name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required for PyPI OIDC trusted publishing

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: javascript

      - name: Run quality suite
        run: npm run quality
        working-directory: javascript

      - name: Publish to npm
        run: npm publish --access public
        working-directory: javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine ".[dev]"
        working-directory: python

      - name: Run quality suite
        run: make quality
        working-directory: python

      - name: Build distributions
        run: python -m build
        working-directory: python

      - name: Check distributions
        run: python -m twine check dist/*
        working-directory: python

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publish-pub-dev:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get
        working-directory: dart

      - name: Run quality suite
        run: make quality
        working-directory: dart

      - name: Publish to pub.dev
        run: dart pub publish --force
        working-directory: dart

  # PHP (jayeshmepani/lipimala) is published from the standalone repo, not this monorepo:
  # https://github.com/jayeshmepani/indic-script-converter-php
  # Packagist versions come from tags on that repository.
  # The monorepo `php/` path is a git submodule pointing at that repo.

