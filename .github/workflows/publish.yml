name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: javascript

      - name: Run tests
        run: npm run quality
        working-directory: javascript

      - name: Publish Package
        run: npm publish --access public
        working-directory: javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine ".[dev]"
        working-directory: python

      - name: Quality checks
        run: make quality
        working-directory: python

      - name: Build distributions
        run: python -m build
        working-directory: python

      - name: Check distributions
        run: python -m twine check dist/*
        working-directory: python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publish-pub-dev:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get
        working-directory: dart

      - name: Run tests
        run: make quality
        working-directory: dart

      - name: Publish Package
        run: dart pub publish --force
        working-directory: dart

  publish-php-mirror:
    name: Sync PHP distribution mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split and Push PHP mirror
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
        run: |
          # Set up SSH agent for pushing to the read-only distribution repo
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

          # Extract only the php/ folder into a standalone main branch
          git subtree split --prefix=php -b php-release

          # Push the split commits to the PHP mirror repository
          git push -f git@github.com:jayeshmepani/indic-script-converter-php.git php-release:main

          # Push the release tag to the PHP mirror repository
          git push -f git@github.com:jayeshmepani/indic-script-converter-php.git php-release:refs/tags/${{ github.ref_name }}
